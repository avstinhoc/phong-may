[package]
name = "qlpm-student"
version = "0.1.0"
description = "QLPM Student - IC3 classroom learning"
authors = ["QLPM"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "qlpm_student_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-autostart = "=2.7.0"
