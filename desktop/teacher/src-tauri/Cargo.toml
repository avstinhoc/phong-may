[package]
name = "qlpm-teacher"
version = "0.1.0"
description = "QLPM Teacher - classroom computer management"
authors = ["QLPM"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "qlpm_teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.3"
url = "=2.5.7"
